{% extends "device_base.html" %}
{% block controls %}
<div class="card mb-3">
  <div class="card-header fw-semibold">Аналоговые входы МВ110-224.2А (RO)</div>
  <table class="table table-sm mb-0">
    <thead><tr><th>Канал</th><th>Ток, мА</th><th>Диапазон, %</th></tr></thead>
    <tbody>
    {% for ch in state.ai %}
      <tr><td>AI{{ ch.n }}</td>
        <td><strong data-bind="ai.{{ loop.index0 }}.ma" data-digits="2">{{ ch.ma }}</strong></td>
        <td>
          <div class="progress" role="progressbar" aria-label="AI{{ ch.n }}">
            <div class="progress-bar" data-width="ai.{{ loop.index0 }}.percent" style="width: {{ ch.percent }}%"></div>
          </div>
        </td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
<div class="card">
  <div class="card-header fw-semibold">Аналоговые выходы МУ110-224.6У (RW), 4–20 мА</div>
  <div class="card-body">
    <div class="row g-2">
    {% for ch in state.ao %}
      <div class="col-6 col-md-4">
        <label class="form-label" for="ao{{ ch.n }}">AO{{ ch.n }}, мА</label>
        <input id="ao{{ ch.n }}" name="ao{{ ch.n }}" type="number" min="4" max="20" step="0.1" class="form-control" value="{{ ch.ma }}">
      </div>
    {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
