<div class="card mt-3">
  <div class="card-header fw-semibold">Журнал статусов</div>
  <table class="table table-striped table-sm mb-0 align-middle">
    <thead class="table-dark">
      <tr><th>Время</th><th>Уровень</th><th>Сообщение</th></tr>
    </thead>
    <tbody id="log-body">
      {% for log in logs %}
      <tr>
        <td>{{ log.time }}</td>
        <td><span class="badge text-bg-{{ {'INFO': 'success', 'WARN': 'warning', 'ERROR': 'danger'}.get(log.level, 'secondary') }}">{{ log.level }}</span></td>
        <td>{{ log.message }}</td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="text-center text-muted">Нет событий</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="card-footer">
    <form method="get" class="d-flex align-items-center gap-2">
      <label for="log-limit" class="form-label mb-0">Показать:</label>
      <select id="log-limit" name="limit" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
        {% for n in (5, 10, 25, 50) %}
        <option value="{{ n }}" {% if n == limit %}selected{% endif %}>{{ n }}</option>
        {% endfor %}
      </select>
      <button class="btn btn-primary btn-sm" type="submit">Обновить</button>
    </form>
  </div>
</div>
