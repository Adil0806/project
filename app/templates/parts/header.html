<header class="bg-white border-bottom">
  <div class="container d-flex justify-content-between align-items-center py-2">
    <a href="/" class="btn btn-outline-secondary btn-sm">← Назад</a>
    <h1 class="h5 mb-0">{{ device.title if device else "SCADA — команда 4" }}</h1>
    <div class="dropdown">
      <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-label="Меню">≡</button>
      <ul class="dropdown-menu dropdown-menu-end">
        {% for d in nav %}
        <li><a class="dropdown-item" href="/{{ d.slug }}/">{{ d.title }}</a></li>
        {% endfor %}
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="/docs">API (Swagger)</a></li>
      </ul>
    </div>
  </div>
</header>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
