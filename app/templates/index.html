{% extends "base.html" %}
{% block title %}SCADA — команда 4{% endblock %}
{% block content %}
<h2 class="h4 mb-3">Приборы</h2>
<div class="row g-3">
  {% for d in devices %}
  <div class="col-md-6">
    <a href="/{{ d.slug }}/" class="card h-100 text-decoration-none text-body device-card">
      <div class="card-body d-flex gap-3 align-items-center">
        <img src="{{ d.image }}" alt="{{ d.model }}" width="96" height="72">
        <div>
          <h3 class="h6 mb-1">{{ d.title }}</h3>
          <p class="mb-1 small text-secondary">{{ d.description }}</p>
          <span class="badge text-bg-secondary">{{ d.protocol }}</span>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
